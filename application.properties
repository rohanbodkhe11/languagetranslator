# ===================================================================
# LinguaBridge Spring Boot Configuration
# ===================================================================

# Server Port (dynamic binding for cloud container platforms like Render/Railway)
server.port=${PORT:8080}
server.servlet.context-path=/

# MongoDB Atlas Configuration
# The URI is injected strictly through the MONGODB_URI environment variable
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/linguabridge_db}
spring.data.mongodb.database=linguabridge_db

# CORS Configuration
# Supply frontend URL (e.g. deployed Vercel domain) via FRONTEND_URL env var
cors.allowed.origins=${FRONTEND_URL:http://localhost:3000,http://localhost:8080,http://127.0.0.1:5500}

# External Translation Provider (MyMemory API)
translation.provider.mymemory.url=https://api.mymemory.translated.net/get
translation.provider.mymemory.email=${MYMEMORY_API_KEY_EMAIL:}

# Logging Configuration
logging.level.root=INFO
logging.level.com.linguabridge=INFO
logging.level.org.springframework.data.mongodb=INFO

# JSON Deserialization Tolerances
spring.jackson.deserialization.fail-on-unknown-properties=false
